# Copy to .github/workflows/provenance-gate.yml in the repository you want to protect,
# then mark the "gate" job as a required status check in branch protection.
#
# pull_request_target runs this file as it exists on the base branch, so a pull request cannot
# edit the gate that judges it. That trigger has access to the base repository's secrets, so this
# job only reads the PR's git history and never runs code from the PR checkout.
#
# pull_request_review has no *_target variant and runs the PR's copy of this file. Require code
# owner review for .github/workflows/** (or use the GitHub App) if PR authors are untrusted.
name: provenance-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch authorship notes and base
        run: |
          git fetch origin '+refs/notes/ai:refs/notes/ai' || echo "no authorship notes in this repository"
          git fetch origin ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Until provenance-gate is on npm, build it from source:
      - name: Install provenance-gate
        run: |
          git clone --depth 1 https://github.com/leowang142857/provenance-gate /tmp/provenance-gate
          cd /tmp/provenance-gate && npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build

      - name: Evaluate policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node /tmp/provenance-gate/dist/cli.js check \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --policy-ref ${{ github.event.pull_request.base.sha }} \
            --github ${{ github.repository }}#${{ github.event.pull_request.number }} \
            | tee "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
